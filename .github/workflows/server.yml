name: Server

# wili-server (server/) is plain Go: tests run on all three desktop systems and the
# binary is cross-compiled for the common ones. ffmpeg-dependent tests skip when it is absent.
on:
  push:
    branches: [main]
    paths: ["server/**", "Makefile", ".github/workflows/server.yml"]
  pull_request:
    branches: [main]
    paths: ["server/**", "Makefile", ".github/workflows/server.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      # The same checks as `make server-test`, spelled out because Windows runners have no make.
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...
      - name: Test with the race detector (Linux)
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: windows, goarch: amd64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build
        run: |
          make server SERVER_GOOS="${{ matrix.goos }}" SERVER_GOARCH="${{ matrix.goarch }}" \
            SERVER_VERSION="${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@v4
        with:
          name: wili-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/server/wili-server-*
          retention-days: 14
