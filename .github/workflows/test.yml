name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PSPDEV_VERSION: v20261001
  # PPSSPP master provides ME instruction emulation (Core/MIPS/MeCore.cpp).
  PPSSPP_REF: 44f1f44be7ff3af79d96e0d14e2d5f9e6ec923b7

jobs:
  host:
    name: Host checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libcurl4-openssl-dev ffmpeg
      - name: Run host checks
        run: sh tools/test-host.sh

  ppsspp-me:
    name: PPSSPP + Media Engine
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkgconf libreadline8 \
            libusb-0.1-4 libgpgme11 libarchive-tools fakeroot curl git python3 \
            bash zlib1g-dev libssl-dev ffmpeg libpng-dev libgl1-mesa-dev \
            libglu1-mesa-dev libx11-dev libsdl2-dev python3-pil
          curl -fL --retry 3 \
            "https://github.com/pspdev/pspdev/releases/download/${PSPDEV_VERSION}/pspdev-ubuntu-latest-x86_64.tar.gz" \
            -o "$RUNNER_TEMP/pspdev.tar.gz"
          tar -xzf "$RUNNER_TEMP/pspdev.tar.gz" -C "$RUNNER_TEMP"
          echo "PSPDEV=$RUNNER_TEMP/pspdev" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/pspdev/bin" >> "$GITHUB_PATH"

      # Headless PPSSPP is cached by its pinned revision and the build recipe.
      - name: Restore PPSSPP Headless
        id: ppsspp-cache
        uses: actions/cache@v4
        with:
          path: build/ppsspp-headless
          key: ppsspp-headless-${{ env.PPSSPP_REF }}-${{ hashFiles('tools/ppsspp/build-ppsspp-headless.sh') }}

      - name: Build PPSSPP Headless
        if: steps.ppsspp-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/hrydgard/ppsspp.git build/ppsspp-src
          git -C build/ppsspp-src checkout --detach "$PPSSPP_REF"
          git -C build/ppsspp-src submodule update --init --recursive --depth 1
          PPSSPP_USE_FFMPEG=OFF JOBS=4 sh tools/ppsspp/build-ppsspp-headless.sh

      # The images are extracted from the user-supplied official updater at run time,
      # verified by SHA-256 and never uploaded, cached or packaged. Set the repository
      # variable PSP_661_UPDATER_URL to use a different HTTPS mirror.
      - name: Extract ME firmware
        run: |
          python3 tools/ppsspp/prepare-me-firmware.py \
            ${PSP_661_UPDATER_URL:+--url "$PSP_661_UPDATER_URL"} \
            --output "$RUNNER_TEMP/me-firmware/flash0"
          echo "BILI_HEADLESS_FIRMWARE_DIR=$RUNNER_TEMP/me-firmware/flash0" >> "$GITHUB_ENV"
        env:
          PSP_661_UPDATER_URL: ${{ vars.PSP_661_UPDATER_URL }}

      - name: Build test package (controlled playback, no account or network APIs)
        run: |
          make package PSPDEV="$PSPDEV" PARALLEL=2 BUILD_DIR=build/playback-test \
            CMAKE_ARGS="-DBILI_DEVICE_PLAYBACK_TEST=ON -DBILI_DIST_DIR=$GITHUB_WORKSPACE/build/playback-test-dist -DBILI_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt"

      - name: Native ME playback (PSP-1000 profile)
        run: python3 tools/ppsspp/test-psp-playback.py

      - name: Native ME playback (Slim profile)
        env:
          BILI_HEADLESS_MODEL: "3000"
          BILI_PLAYBACK_RESULTS: ${{ github.workspace }}/results/playback-slim
        run: python3 tools/ppsspp/test-psp-playback.py

      - name: Playback controls
        env:
          BILI_HEADLESS_CLIENT_DIR: ${{ github.workspace }}/build/playback-test
          BILI_HEADLESS_PACKAGE: ${{ github.workspace }}/build/playback-test-dist/PSP/GAME/WiliMini
        run: python3 tools/ppsspp/test-playback-controls.py

      - name: Build production package
        run: |
          make package PSPDEV="$PSPDEV" PARALLEL=2 \
            CMAKE_ARGS='-DBILI_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt'

      - name: UI smoke (all home styles)
        run: python3 tools/ppsspp/test-ui-smoke.py

      - name: Built-in pinyin keyboard smoke
        run: python3 tools/ppsspp/test-ime-smoke.py

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppsspp-me-results
          path: |
            results/
            !results/**/*.wav
          if-no-files-found: ignore
          retention-days: 7
