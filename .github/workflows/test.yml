name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # PSPDEV, prebuilt PSP FFmpeg/libcurl, PPSSPP headless and the ME firmware live in a
  # private image (docker/ci.Dockerfile, target ci-playback).
  image:
    uses: ./.github/workflows/ci-image.yml
    permissions:
      contents: read
      packages: write

  host:
    name: Host checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libcurl4-openssl-dev
      - name: Run host checks
        run: sh tools/test-host.sh

  ppsspp-me:
    name: PPSSPP + Media Engine
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read # pull the private playback image from GHCR
    defaults:
      run:
        shell: bash
    container:
      image: ${{ needs.image.outputs.playback_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # Docker's default /dev/shm is 64 MB. PPSSPP backs the emulated 64 MB (Slim) PSP with
      # shared memory; with the default the headless run died with SIGBUS (exit 135).
      options: --shm-size=1g
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Packaging reads build/curl-source directly (license + manifest hash), so link the
      # image's patched libcurl source into the workspace.
      - name: Link prebuilt libcurl source
        run: mkdir -p build && ln -sfn "$BILI_CURL_SOURCE_DIR" build/curl-source

      # PPSSPP headless and the ME firmware come from the image (PPSSPP_HEADLESS,
      # BILI_HEADLESS_FIRMWARE_DIR). Packages are built with cmake directly because
      # `make package` would also rebuild FFmpeg and libcurl, which the image provides
      # through PSP_FFMPEG_PREFIX / PSP_CURL_PREFIX.
      - name: Build test package (controlled playback, no account or network APIs)
        run: |
          psp-cmake -S . -B build/playback-test -DCMAKE_BUILD_TYPE=Release \
            -DPSP_FFMPEG_PREFIX="$PSP_FFMPEG_PREFIX" -DPSP_CURL_PREFIX="$PSP_CURL_PREFIX" \
            -DBILI_FFMPEG_SOURCE_DIR="$BILI_FFMPEG_SOURCE_DIR" \
            -DBILI_FFMPEG_BUILD_DIR="$BILI_FFMPEG_BUILD_DIR" \
            -DBILI_DEVICE_PLAYBACK_TEST=ON \
            -DBILI_DIST_DIR="$GITHUB_WORKSPACE/build/playback-test-dist" \
            -DBILI_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
          cmake --build build/playback-test --target package --parallel "$(nproc)"

      - name: Native ME playback (PSP-1000 profile)
        run: python3 tools/ppsspp/test-psp-playback.py

      # In a container job ${{ github.workspace }} is the host path; use $GITHUB_WORKSPACE.
      - name: Native ME playback (Slim profile)
        env:
          BILI_HEADLESS_MODEL: "3000"
        run: |
          export BILI_PLAYBACK_RESULTS="$GITHUB_WORKSPACE/results/playback-slim"
          python3 tools/ppsspp/test-psp-playback.py

      - name: Playback controls
        run: |
          export BILI_HEADLESS_CLIENT_DIR="$GITHUB_WORKSPACE/build/playback-test"
          export BILI_HEADLESS_PACKAGE="$GITHUB_WORKSPACE/build/playback-test-dist/PSP/GAME/WiliMini"
          python3 tools/ppsspp/test-playback-controls.py

      - name: Build production package
        run: |
          psp-cmake -S . -B build/client -DCMAKE_BUILD_TYPE=Release \
            -DPSP_FFMPEG_PREFIX="$PSP_FFMPEG_PREFIX" -DPSP_CURL_PREFIX="$PSP_CURL_PREFIX" \
            -DBILI_FFMPEG_SOURCE_DIR="$BILI_FFMPEG_SOURCE_DIR" \
            -DBILI_FFMPEG_BUILD_DIR="$BILI_FFMPEG_BUILD_DIR" \
            -DBILI_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
          cmake --build build/client --target package --parallel "$(nproc)"

      - name: UI smoke (all home styles)
        run: python3 tools/ppsspp/test-ui-smoke.py

      - name: Built-in pinyin keyboard smoke
        run: python3 tools/ppsspp/test-ime-smoke.py

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppsspp-me-results
          path: |
            results/
            !results/**/*.wav
          if-no-files-found: ignore
          retention-days: 7
