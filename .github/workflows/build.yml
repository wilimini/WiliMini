name: Build PSP package

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pspdev/pspdev-docker:latest
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build PSP package
        shell: bash
        run: |
          PSPDEV="${PSPDEV:-/usr/local/pspdev}"
          if [[ ! -x "$PSPDEV/bin/psp-cmake" ]]; then
            echo "PSP toolchain not found under $PSPDEV" >&2
            exit 1
          fi

          if [[ -f /etc/ssl/certs/ca-certificates.crt ]]; then
            CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
          elif [[ -f /etc/ssl/cert.pem ]]; then
            CA_BUNDLE=/etc/ssl/cert.pem
          else
            echo "Could not find the system CA bundle" >&2
            exit 1
          fi

          make package PSPDEV="$PSPDEV" PARALLEL=2 \
            CMAKE_ARGS="-DBILI_CA_BUNDLE=$CA_BUNDLE"

      - name: Upload PSP package artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiliMini-pr-${{ github.event.pull_request.number || github.run_number }}
          path: dist/PSP/GAME/WiliMini/
          if-no-files-found: error
          retention-days: 14
