name: Build PSP package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Toolchain and prebuilt PSP dependencies live in an image (docker/ci.Dockerfile).
  image:
    uses: ./.github/workflows/ci-image.yml
    permissions:
      contents: read
      packages: write

  build:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read # pull the CI image from GHCR
    # Container jobs default to sh; the archive step uses bash syntax.
    defaults:
      run:
        shell: bash
    container:
      image: ${{ needs.image.outputs.ci_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify release tag is on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release tags must point to a commit already merged into main" >&2
            exit 1
          fi

      # Packaging reads build/curl-source directly (license + manifest hash), so link the
      # image's patched libcurl source into the workspace.
      - name: Link prebuilt libcurl source
        run: mkdir -p build && ln -sfn "$BILI_CURL_SOURCE_DIR" build/curl-source

      # Not `make package`: that target also rebuilds FFmpeg and libcurl, which the image
      # already provides through PSP_FFMPEG_PREFIX / PSP_CURL_PREFIX.
      - name: Build PSP package
        run: |
          cmake --version
          psp-gcc --version
          psp-cmake -S . -B build/client -DCMAKE_BUILD_TYPE=Release \
            -DPSP_FFMPEG_PREFIX="$PSP_FFMPEG_PREFIX" -DPSP_CURL_PREFIX="$PSP_CURL_PREFIX" \
            -DBILI_FFMPEG_SOURCE_DIR="$BILI_FFMPEG_SOURCE_DIR" \
            -DBILI_FFMPEG_BUILD_DIR="$BILI_FFMPEG_BUILD_DIR" \
            -DBILI_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
          cmake --build build/client --target package --parallel "$(nproc)"

      - name: Create install archive and checksum
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="$GITHUB_REF_NAME"
          elif [[ -n "$PR_NUMBER" ]]; then
            VERSION="pr-$PR_NUMBER"
          else
            VERSION="${GITHUB_SHA:0:8}"
          fi
          mkdir -p artifacts
          ARCHIVE="WiliMini-$VERSION.zip"
          (cd dist/PSP/GAME && python3 -m zipfile -c "$GITHUB_WORKSPACE/artifacts/$ARCHIVE" WiliMini)
          (cd artifacts && sha256sum "$ARCHIVE" > "$ARCHIVE.sha256")
          # SHA256SUMS is what the in-app updater verifies (see docs/auto-update.md).
          (cd artifacts && sha256sum "$ARCHIVE" > SHA256SUMS)

      - name: Upload PSP package artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiliMini-build
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download successful build artifacts
        uses: actions/download-artifact@v4
        with:
          name: WiliMini-build
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: WiliMini ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*.zip
            artifacts/*.sha256
            artifacts/SHA256SUMS
