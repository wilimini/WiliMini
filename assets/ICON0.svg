      <stop stop-color="#f9a3c1"/>
      <stop offset="0.55" stop-color="#fb83ae"/>
      <stop offset="1" stop-color="#fa79a7"/>
    </linearGradient>
    <linearGradient id="shell" x2="0" y2="1">
      <stop stop-color="#fffefe"/>
      <stop offset="1" stop-color="#fff9fc"/>
    </linearGradient>
    <linearGradient id="face" x2="0.2" y2="1">
      <stop stop-color="#fff7fa"/>
      <stop offset="1" stop-color="#fff1f7"/>
    </linearGradient>
    <linearGradient id="console" x2="0" y2="1">
      <stop stop-color="#fc7cab"/>
      <stop offset="1" stop-color="#f7649b"/>
    </linearGradient>
    <linearGradient id="screen" x2="1" y2="1">
      <stop stop-color="#fa75a7"/>
      <stop offset="1" stop-color="#fb649d"/>
    </linearGradient>
    <filter id="pinkShadow" x="-15%" y="-15%" width="130%" height="140%">
