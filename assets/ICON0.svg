<svg xmlns="http://www.w3.org/2000/svg" width="144" height="80" viewBox="0 0 144 80" role="img" aria-labelledby="title desc">
  <title id="title">WiliMini 粉色掌机小机器人</title>
  <desc id="desc">粉色背景上，白色触角机器人抱着带播放三角形的粉色掌机，旁边有白色光芒和爱心。</desc>
  <defs>
